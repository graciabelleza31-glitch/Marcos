<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${categoria.idCat == null ? 'Registrar Categoría' : 'Editar Categoría'})}"></head>

<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="d-flex">

    <nav th:replace="~{fragments/layout :: sidebar('categorias')}"></nav>

    <div class="flex-grow-1 d-flex flex-column min-vh-100">

        <main class="flex-grow-1 p-4">

            <div class="d-flex align-items-center mb-3">
                <a th:href="@{/categorias}" class="btn btn-outline-secondary me-3">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <div>
                    <h3 class="mb-0">
                        <span th:if="${categoria.idCat == null}">Registrar Categoría</span>
                        <span th:if="${categoria.idCat != null}">Editar Categoría</span>
                    </h3>
                    <small class="text-muted">Defina el nombre y detalle descriptivo de la categoría</small>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <form th:action="@{/categorias/guardar}" th:object="${categoria}" method="post" 
                          class="card shadow-sm border-0 p-4">

                        <input type="hidden" th:field="*{idCat}"/>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre de la Categoría *</label>
                            <input type="text" th:field="*{nomCat}" class="form-control" 
                                   placeholder="Ej: Abarrotes, Bebidas, Lácteos" required/>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Descripción</label>
                            <textarea th:field="*{descCat}" rows="4" class="form-control" 
                                      placeholder="Breve detalle de los productos que agrupa esta categoría..."></textarea>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                            <a th:href="@{/categorias}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-save me-1"></i> Guardar Categoría
                            </button>
                        </div>

                    </form>
                </div>
            </div>

        </main>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>

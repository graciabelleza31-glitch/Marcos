<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- ============================================================
     FRAGMENT: HEAD
     ============================================================ -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${titulo} + ' | Inventario Abarrotes'">Inventario</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>

    <!-- Estilos personalizados -->
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; width: 240px; }
        .sidebar .nav-link { color: #cfd8dc; border-radius: 6px; padding: .5rem .75rem; }
        .sidebar .nav-link:hover { background-color: #343a40; color: #fff; }
        .sidebar .nav-link.active { background-color: #0d6efd; color: #fff; }
        .sidebar .section-title { font-size: .75rem; color: #6c757d; padding: .5rem .75rem; }
    </style>
</head>

<body>

<!-- ============================================================
     FRAGMENT: NAVBAR SUPERIOR
     ============================================================ -->
<nav th:fragment="navbar" class="navbar navbar-dark bg-dark px-3 shadow-sm">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">
            <i class="bi bi-box-seam"></i> Sistema de Inventario
        </span>
        <div class="d-flex align-items-center text-white">
            <i class="bi bi-person-circle fs-4 me-2"></i>
            <span>Administrador</span>
        </div>
    </div>
</nav>

<!-- ============================================================
     FRAGMENT: SIDEBAR (MENÚ LATERAL)
     ============================================================ -->
<nav th:fragment="sidebar(activo)" class="sidebar bg-dark d-flex flex-column p-3">

    <ul class="nav flex-column">

        <li class="nav-item mb-1">
            <a th:href="@{/dashboard}"
               th:classappend="${activo == 'dashboard'} ? 'active' : ''"
               class="nav-link">
                <i class="bi bi-speedometer2 me-2"></i> Dashboard
            </a>
        </li>

        <li class="nav-item mb-1">
            <a th:href="@{/productos}"
               th:classappend="${activo == 'productos'} ? 'active' : ''"
               class="nav-link">
                <i class="bi bi-box-seam me-2"></i> Productos
            </a>
        </li>

        <li class="nav-item mb-1">
            <a th:href="@{/categorias}"
               th:classappend="${activo == 'categorias'} ? 'active' : ''"
               class="nav-link">
                <i class="bi bi-tags me-2"></i> Categorías
            </a>
        </li>

        <li class="nav-item mb-1">
            <a th:href="@{/proveedores}"
               th:classappend="${activo == 'proveedores'} ? 'active' : ''"
               class="nav-link">
                <i class="bi bi-truck me-2"></i> Proveedores
            </a>
        </li>

        <li class="nav-item mb-1">
            <a th:href="@{/movimientos}"
               th:classappend="${activo == 'movimientos'} ? 'active' : ''"
               class="nav-link">
                <i class="bi bi-arrow-left-right me-2"></i> Movimientos
            </a>
        </li>

        <li class="section-title mt-3">GRÁFICOS</li>

        <li class="nav-item mb-1">
            <a th:href="@{/graficos/barras}"
               th:classappend="${activo == 'barras'} ? 'active' : ''"
               class="nav-link">
                <i class="bi bi-bar-chart-line me-2"></i> Barras y Líneas
            </a>
        </li>

        <li class="nav-item mb-1">
            <a th:href="@{/graficos/circular}"
               th:classappend="${activo == 'circular'} ? 'active' : ''"
               class="nav-link">
                <i class="bi bi-pie-chart me-2"></i> Circular
            </a>
        </li>
    </ul>

    <div class="mt-auto pt-3 border-top border-secondary">
        <a th:href="@{/logout}" class="nav-link text-danger">
            <i class="bi bi-box-arrow-right me-2"></i> Cerrar Sesión
        </a>
    </div>
</nav>

<!-- ============================================================
     FRAGMENT: FOOTER
     ============================================================ -->
<footer th:fragment="footer" class="text-center text-muted py-3 small border-top bg-white">
    <div>
        &copy; 2026 <strong>Sistema de Inventario</strong> — Tienda de Abarrotes
    </div>
    <div>
        Universidad Tecnológica del Perú · Marcos de Desarrollo Web
    </div>
</footer>

<!-- ============================================================
     FRAGMENT: SCRIPTS
     ============================================================ -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>

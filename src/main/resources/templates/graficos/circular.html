<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Gráfico Circular')}"></head>

<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="d-flex">

    <nav th:replace="~{fragments/layout :: sidebar('circular')}"></nav>

    <div class="flex-grow-1 d-flex flex-column min-vh-100">

        <main class="flex-grow-1 p-4">

            <div class="mb-4">
                <h3 class="mb-0 fw-bold">Distribución de Productos por Categoría</h3>
                <small class="text-muted">Proporción de artículos agrupados por rubro</small>
            </div>

            <div class="row">
                <div class="col-md-7">
                    <div class="card shadow-sm border-0 p-4 bg-white">
                        <div style="height: 380px; width: 100%;">
                            <canvas id="chartDona"></canvas>
                        </div>
                    </div>
                </div>

                <div class="col-md-5">
                    <div class="card shadow-sm border-0 p-4 bg-white h-100">
                        <h6 class="fw-bold mb-3">Resumen de Categorías</h6>
                        <ul class="list-group list-group-flush">
                            <li th:each="cat, i : ${categorias}" class="list-group-item d-flex justify-content-between align-items-center px-0">
                                <span th:text="${cat}"></span>
                                <span class="badge bg-primary rounded-pill" th:text="${cantidades[i.index]} + ' prod.'"></span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

        </main>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

<!-- Librería Chart.js vía CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script th:inline="javascript">
    const categorias = /*[[${categorias}]]*/ [];
    const cantidades = /*[[${cantidades}]]*/ [];

    const ctx = document.getElementById('chartDona').getContext('2d');
    new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: categorias,
            datasets: [{
                data: cantidades,
                backgroundColor: [
                    '#0d6efd',
                    '#198754',
                    '#ffc107',
                    '#0dcaf0',
                    '#6f42c1',
                    '#fd7e14'
                ],
                hoverOffset: 6
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { position: 'bottom' }
            }
        }
    });
</script>

</body>
</html>

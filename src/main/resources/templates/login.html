<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Iniciar Sesión | Sistema de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body {
            background-color: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

<div class="card login-card p-4 bg-white border-0">
    <div class="text-center mb-4">
        <div class="bg-primary text-white d-inline-flex p-3 rounded-circle mb-2">
            <i class="bi bi-box-seam fs-2"></i>
        </div>
        <h4 class="fw-bold mb-1">SISTEMA DE INVENTARIO</h4>
        <p class="text-muted small">Iniciar sesión</p>
    </div>

    <!-- Alertas -->
    <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>
    <div th:if="${msg}" class="alert alert-success py-2 small" th:text="${msg}"></div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label small text-muted">Correo electrónico</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                <input type="email" name="email" class="form-control" placeholder="admin@marcos.com" required/>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label small text-muted">Contraseña</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required/>
            </div>
        </div>

        <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="recordar"/>
            <label class="form-check-label small text-muted" for="recordar">Recordar credenciales</label>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            Ingresar al Sistema
        </button>
    </form>
</div>

</body>
</html>

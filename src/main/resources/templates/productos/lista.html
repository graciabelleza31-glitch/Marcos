<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Productos')}"></head>

<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="d-flex">

    <nav th:replace="~{fragments/layout :: sidebar('productos')}"></nav>

    <div class="flex-grow-1 d-flex flex-column min-vh-100">

        <main class="flex-grow-1 p-4">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h3 class="mb-0">Productos</h3>
                    <small class="text-muted">Gestión de catálogo e inventario</small>
                </div>
                <a th:href="@{/productos/nuevo}" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Nuevo Producto
                </a>
            </div>

            <div th:if="${msg}" class="alert alert-success alert-dismissible fade show">
                <span th:text="${msg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- ======================================================
                 FILTROS (buscador + 3 selects + botón filtrar)
                 ====================================================== -->
            <form method="get" th:action="@{/productos}" class="row g-2 mb-3 align-items-center">

                <!-- Buscador -->
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                        <input type="text" name="q" class="form-control"
                               placeholder="Buscar por nombre, categoría o proveedor..."
                               th:value="${q}"/>
                    </div>
                </div>

                <!-- Categoría -->
                <div class="col-md-2">
                    <select name="idCat" class="form-select">
                        <option value="">Categoría</option>
                        <option th:each="c : ${categorias}"
                                th:value="${c.idCat}"
                                th:text="${c.nomCat}"
                                th:selected="${idCat != null and idCat == c.idCat}"></option>
                    </select>
                </div>

                <!-- Proveedor -->
                <div class="col-md-2">
                    <select name="idProv" class="form-select">
                        <option value="">Proveedor</option>
                        <option th:each="p : ${proveedores}"
                                th:value="${p.idProv}"
                                th:text="${p.nomProv}"
                                th:selected="${idProv != null and idProv == p.idProv}"></option>
                    </select>
                </div>

                <!-- Estado -->
                <div class="col-md-2">
                    <select name="estado" class="form-select">
                        <option value="">Estado</option>
                        <option value="Activo"   th:selected="${estado == 'Activo'}">Activo</option>
                        <option value="Inactivo" th:selected="${estado == 'Inactivo'}">Inactivo</option>
                    </select>
                </div>

                <!-- Botón filtrar -->
                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-outline-secondary w-100">
                        <i class="bi bi-funnel"></i> Filtrar
                    </button>
                    <a th:href="@{/productos}" class="btn btn-outline-danger" title="Limpiar">
                        <i class="bi bi-x-lg"></i>
                    </a>
                </div>
            </form>

            <!-- Tabla -->
            <div class="card shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th class="text-center">Imagen</th>  
                            <th>Código</th>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Proveedor</th>
                            <th class="text-end">P. Compra</th>
                            <th class="text-end">P. Venta</th>
                            <th class="text-center">Stock</th>
                            <th class="text-center">Estado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p, it : ${productos}">
                            <td th:text="${it.index + 1}"></td>

                            <td class="text-center">
                                <img th:if="${p.imagen != null and !p.imagen.isBlank()}"
                                    th:src="@{'/images/' + ${p.imagen}}"
                                    alt="img"
                                    style="width:44px; height:44px; object-fit:cover; border-radius:6px;"/>
                                <i th:unless="${p.imagen != null and !p.imagen.isBlank()}"
                                    class="bi bi-image text-muted"></i>
                            </td>

                            <td th:text="${p.codProd}"></td>
                            <td th:text="${p.nomProd}"></td>
                            <td th:text="${p.nomCat}"></td>
                            <td th:text="${p.nomProv}"></td>
                            <td class="text-end"
                                th:text="'S/ ' + ${#numbers.formatDecimal(p.precioCompra,1,2)}"></td>
                            <td class="text-end"
                                th:text="'S/ ' + ${#numbers.formatDecimal(p.precioVenta,1,2)}"></td>
                            <td class="text-center">
                                <span th:text="${p.stockProd}"
                                      th:classappend="${p.stockProd <= p.stockMinimo} ? 'text-danger fw-bold' : ''"></span>
                            </td>
                            <td class="text-center">
                                <span th:if="${p.estado == 'Activo'}" class="badge bg-success">Activo</span>
                                <span th:if="${p.estado == 'Inactivo'}" class="badge bg-secondary">Inactivo</span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/productos/editar/{id}(id=${p.idProd})}"
                                   class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:href="@{/productos/eliminar/{id}(id=${p.idProd})}"
                                   class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('¿Eliminar este producto?');">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(productos)}">
                            <td colspan="11" class="text-center text-muted py-4">
                                No se encontraron productos
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>

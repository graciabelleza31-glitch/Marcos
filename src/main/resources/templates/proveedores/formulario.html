<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${proveedor.idProv == null ? 'Registrar Proveedor' : 'Editar Proveedor'})}"></head>

<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="d-flex">

    <nav th:replace="~{fragments/layout :: sidebar('proveedores')}"></nav>

    <div class="flex-grow-1 d-flex flex-column min-vh-100">

        <main class="flex-grow-1 p-4">

            <div class="d-flex align-items-center mb-3">
                <a th:href="@{/proveedores}" class="btn btn-outline-secondary me-3">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <div>
                    <h3 class="mb-0">
                        <span th:if="${proveedor.idProv == null}">Registrar Proveedor</span>
                        <span th:if="${proveedor.idProv != null}">Editar Proveedor</span>
                    </h3>
                    <small class="text-muted">Complete la información legal y de contacto del distribuidor</small>
                </div>
            </div>

            <div class="row">
                <div class="col-md-7">
                    <form th:action="@{/proveedores/guardar}" th:object="${proveedor}" method="post" 
                          class="card shadow-sm border-0 p-4">

                        <input type="hidden" th:field="*{idProv}"/>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre o Razón Social *</label>
                            <input type="text" th:field="*{nomProv}" class="form-control" 
                                   placeholder="Ej: Distribuidora Alianza SAC" required/>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">RUC (11 dígitos) *</label>
                                <input type="text" th:field="*{rucProv}" class="form-control" 
                                       maxlength="11" placeholder="Ej: 20123456789" required/>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Teléfono de Contacto</label>
                                <input type="text" th:field="*{telProv}" class="form-control" 
                                       placeholder="Ej: 987654321"/>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                            <a th:href="@{/proveedores}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-save me-1"></i> Guardar Proveedor
                            </button>
                        </div>

                    </form>
                </div>
            </div>

        </main>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
